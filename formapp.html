<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Newhouse</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- SEO description (not visible) -->
  <meta name="description" content="Please answer our communication form at Monte Central">


  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f0f0f;
      color: #fff;
    }

    .container {
      max-width: 720px;
      margin: 30px auto;
      padding: 0 20px;
      text-align: center;
    }

    h1 {
      font-size: 22px;
      font-weight: 500;
      margin-bottom: 20px;
      color: #eaeaea;
    }

    .video-wrapper {
      width: 100%;
      aspect-ratio: 16 / 9;
      border-radius: 12px;
      overflow: hidden;
      background: #000;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    video {
      width: 100%;
      display: block;
    }

    .skip {
      margin-top: 15px;
      font-size: 13px;
      color: #777;
    }

  </style>
</head>
<body>

  <div class="container">
    <h1>Monte Central</h1>
<hr>
    <h1>Please watch a short ad before proceeding</h1>

    <div class="video-wrapper">
      <video controls>
        <source src="adclip15.mp4" type="video/mp4">
        Your browser does not support the video tag.
      </video>
    </div>

    <div class="skip">
      You may continue after the video ends.
    </div>
  </div>



</body>
</html>
