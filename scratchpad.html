<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monte Scratchpad</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d0d0f;--panel:#151518;--text:#e6e6e6;--sub:#8d8d93;--accent:#4b8bff;--border:rgba(255,255,255,.08)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;min-height:100vh}
.wrap{width:min(92%,900px);margin:auto;padding:70px 0}
.top{display:flex;justify-content:space-between;gap:20px;align-items:center;margin-bottom:28px}
h1{font-size:2rem;margin:0 0 6px}.sub{color:var(--sub);font-size:.95rem}.back{color:var(--accent);text-decoration:none;font-weight:500}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:18px}
textarea{width:100%;min-height:55vh;resize:vertical;background:#101012;color:var(--text);border:1px solid var(--border);border-radius:12px;padding:18px;font:400 1rem/1.6 Inter,system-ui,sans-serif;outline:none}
textarea:focus{border-color:var(--accent)}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:12px;color:var(--sub);font-size:.85rem;flex-wrap:wrap}
.actions{display:flex;gap:8px}.btn{background:#1d1d22;color:var(--text);border:1px solid var(--border);border-radius:9px;padding:9px 12px;cursor:pointer;font:inherit}.btn:hover{border-color:var(--accent)}
@media(max-width:600px){.wrap{padding:40px 0}.top{align-items:flex-start;flex-direction:column}textarea{min-height:62vh}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>
      <h1>Scratchpad</h1>
      <div class="sub">A tiny local notebook inside Monte Central.</div>
    </div>
    <a class="back" href="./mtc">← Monte Central</a>
  </div>

  <div class="panel">
    <textarea id="note" placeholder="Write anything here…"></textarea>
    <div class="bar">
      <span id="status">Saved locally</span>
      <div class="actions">
        <button class="btn" id="copyBtn">Copy</button>
        <button class="btn" id="clearBtn">Clear</button>
      </div>
    </div>
  </div>
</div>
<script>
const note=document.getElementById('note');
const status=document.getElementById('status');
const key='montecentral-scratchpad';
note.value=localStorage.getItem(key)||'';
let timer;
note.addEventListener('input',()=>{
  status.textContent='Saving…';
  clearTimeout(timer);
  timer=setTimeout(()=>{
    localStorage.setItem(key,note.value);
    status.textContent='Saved locally';
  },250);
});
document.getElementById('copyBtn').addEventListener('click',async()=>{
  try{await navigator.clipboard.writeText(note.value);status.textContent='Copied';}
  catch{note.select();document.execCommand('copy');status.textContent='Copied';}
  setTimeout(()=>status.textContent='Saved locally',1200);
});
document.getElementById('clearBtn').addEventListener('click',()=>{
  if(!confirm('Clear the Scratchpad?')) return;
  note.value='';
  localStorage.removeItem(key);
  status.textContent='Cleared';
});
</script>
</body>
</html>
